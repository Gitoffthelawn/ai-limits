<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Limits</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./styles/nav.css" />
  </head>
  <body>
    <main class="app">
      <nav class="app-nav" id="app-nav" aria-label="Main navigation">
        <button
          type="button"
          class="app-nav-tab"
          id="nav-overview"
          data-view="overview"
          aria-current="page"
        >
          Overview
        </button>
        <button
          type="button"
          class="app-nav-tab"
          id="nav-settings"
          data-view="settings"
          aria-current="false"
        >
          Settings
        </button>
        <button
          type="button"
          class="app-nav-tab"
          id="nav-help"
          data-view="help"
          aria-current="false"
        >
          Help
        </button>
      </nav>

      <div class="view" id="overview-view">
        <section
          class="update-banner"
          id="update-banner"
          aria-live="polite"
          hidden
        >
          <span class="update-banner-text" id="update-banner-text"></span>
          <div class="update-banner-actions">
            <button type="button" class="update-restart-button" id="update-restart">
              Restart now
            </button>
            <button
              type="button"
              class="update-dismiss-button"
              id="update-dismiss"
              aria-label="Dismiss update notice"
            >
              Later
            </button>
          </div>
        </section>

        <section class="providers" aria-label="Provider limits" id="provider-list"></section>

        <section class="status-line" aria-live="polite" id="status-line" hidden></section>

        <div class="overview-actions">
          <button type="button" class="refresh-button" id="refresh-button">
            UPDATE ALL DATA NOW
          </button>
        </div>
      </div>

      <section class="settings-view" id="settings-view" aria-label="Settings" hidden>
        <div class="settings-section">
          <p class="settings-section-label">Providers</p>
          <label class="settings-toggle">
            <span>Cursor</span>
            <input type="checkbox" id="setting-cursor" checked />
          </label>
          <label class="settings-toggle">
            <span>Cloud</span>
            <input type="checkbox" id="setting-cloud" checked />
          </label>
          <label class="settings-toggle">
            <span>Codex</span>
            <input type="checkbox" id="setting-codex" checked />
          </label>
        </div>
        <div class="settings-section">
          <p class="settings-section-label">Display</p>
          <label class="settings-toggle">
            <span>Limits</span>
            <input type="checkbox" id="setting-show-limits" checked />
          </label>
          <label class="settings-toggle">
            <span>Plan</span>
            <input type="checkbox" id="setting-show-plan" checked />
          </label>
          <label class="settings-toggle">
            <span>Source</span>
            <input type="checkbox" id="setting-show-source" />
          </label>
          <label class="settings-toggle">
            <span>Update time</span>
            <input type="checkbox" id="setting-show-update-time" checked />
          </label>
        </div>
        <div class="settings-section">
          <p class="settings-section-label">Other</p>
          <label class="settings-toggle">
            <span>Notifications</span>
            <input type="checkbox" id="setting-notifications" checked />
          </label>
          <label class="settings-toggle">
            <span>Automatic updates</span>
            <input type="checkbox" id="setting-auto-update" checked />
          </label>
          <label class="settings-toggle">
            <span>Dark theme</span>
            <input type="checkbox" id="setting-dark-theme" />
          </label>
        </div>
      </section>

      <section class="help-view" id="help-view" aria-label="Help" hidden>
        <div class="help-layout">
          <nav class="help-menu" id="help-menu" aria-label="Help sections"></nav>
          <div class="help-content" id="help-content"></div>
        </div>
      </section>
    </main>

    <script type="module" src="./modules/main.js"></script>
  </body>
</html>
