<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Limits</title>
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app">
      <div class="view" id="home-view">
      <section class="app-toolbar" aria-label="Refresh controls">
        <div class="toolbar-actions">
          <button
            type="button"
            class="help-button"
            id="help-button"
            aria-label="Help"
          >
            <svg
              class="help-icon"
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <circle cx="12" cy="12" r="10" />
              <path d="M12 16v-4" />
              <path d="M12 8h.01" />
            </svg>
          </button>
          <button type="button" class="refresh-button" id="refresh-button">
            UPDATE ALL NOW
          </button>
          <div class="settings-menu" id="settings-menu">
            <button
              type="button"
              class="settings-button"
              id="settings-button"
              aria-label="Settings"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="settings-dropdown"
            >
              <svg
                class="settings-icon"
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path
                  d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
                />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
            <div class="settings-dropdown" id="settings-dropdown" hidden>
              <div class="settings-section">
                <p class="settings-section-label">Behavior</p>
                <div class="source-priority-row">
                  <div
                    class="segmented-control"
                    id="setting-source-priority"
                    role="group"
                    aria-label="Source priority"
                  ></div>
                  <button
                    type="button"
                    class="source-priority-info"
                    id="setting-source-priority-info"
                    aria-label="Source priority details"
                  >
                    <svg
                      xmlns="http://www.w3.org/2000/svg"
                      width="16"
                      height="16"
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="2"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      aria-hidden="true"
                    >
                      <circle cx="12" cy="12" r="10" />
                      <path d="M12 16v-4" />
                      <path d="M12 8h.01" />
                    </svg>
                  </button>
                </div>
              </div>
              <div class="settings-section">
                <p class="settings-section-label">Providers</p>
                <label class="settings-toggle">
                  <span>Cursor</span>
                  <input type="checkbox" id="setting-cursor" checked />
                </label>
                <label class="settings-toggle">
                  <span>Cloud</span>
                  <input type="checkbox" id="setting-cloud" checked />
                </label>
                <label class="settings-toggle">
                  <span>Codex</span>
                  <input type="checkbox" id="setting-codex" checked />
                </label>
              </div>
              <div class="settings-section">
                <p class="settings-section-label">Other</p>
                <label class="settings-toggle">
                  <span>Notifications</span>
                  <input type="checkbox" id="setting-notifications" checked />
                </label>
                <label class="settings-toggle">
                  <span>Dark theme</span>
                  <input type="checkbox" id="setting-dark-theme" />
                </label>
              </div>
            </div>
          </div>
        </div>
      </section>

      <section class="providers" aria-label="Provider limits" id="provider-list"></section>

      <section class="status-line" aria-live="polite" id="status-line" hidden></section>
      </div>

      <section class="help-view" id="help-view" aria-label="Help" hidden>
        <header class="help-header">
          <button
            type="button"
            class="help-back"
            id="help-back"
            aria-label="Back"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="m15 18-6-6 6-6" />
            </svg>
          </button>
          <h1 class="help-title">Help</h1>
        </header>
        <div class="help-layout">
          <nav class="help-menu" id="help-menu" aria-label="Help sections"></nav>
          <div class="help-content" id="help-content"></div>
        </div>
      </section>
    </main>

    <script>
      const updateFrequencyOptions = [
        "Manual only",
        "1 min",
        "5 min",
        "10 min",
        "30 min",
        "1 hour",
      ];
      const DEFAULT_UPDATE_FREQUENCY = "5 min";
      const PROVIDER_STATUS_HIDE_MS = 4000;
      const SETTINGS_STORAGE_KEY = "ai-limits-settings";
      const PROVIDER_INTERVALS_STORAGE_KEY = "ai-limits-provider-intervals";
      const THEME_STORAGE_KEY = "ai-limits-theme";
      const PROVIDER_IDS = ["codex", "claude", "cursor"];
      const EXTERNAL_LINKS = {
        claude: "https://code.claude.com/docs/en/setup",
        codex: "https://developers.openai.com/codex/cli",
        github: "https://github.com/md2it/ai-limits",
        license: "https://github.com/md2it/ai-limits/blob/main/LICENSE",
      };

      const SOURCE_PRIORITY_OPTIONS = ["fast", "full", "best"];
      const SOURCE_PRIORITY_LABELS = {
        fast: "Fast",
        full: "Full",
        best: "Best",
      };

      // Help sub-pages. Each chapter is one entry in the left menu and, on macOS,
      // one item in the native Help menu (kept in sync in src-tauri/src/main.rs).
      // Adding a chapter here adds it to the in-app menu automatically.
      //
      // Keep this content in sync with the app: whenever a change here affects
      // what a section describes (a setting, a state, a permission, a link),
      // update the matching chapter in the same change.
      const HELP_CHAPTERS = [
        {
          id: "about",
          label: "About",
          title: "About AI-Limits",
          render() {
            return `
              <p>
                AI-Limits shows how much of your Codex, Claude, and Cursor subscription
                limits you have left, in one place, without opening each provider's site.
              </p>
              <dl class="info-terms">
                <div>
                  <dt>Free</dt>
                  <dd>Open source, no sign-up, and no service in between.</dd>
                </div>
                <div>
                  <dt>Cross-platform</dt>
                  <dd>Runs on macOS, Windows, and Linux.</dd>
                </div>
                <div>
                  <dt>Proactive</dt>
                  <dd>Can notify you before you run out, so limits don't catch you mid-task.</dd>
                </div>
                <div>
                  <dt>Local</dt>
                  <dd>All data comes from your own setup or account.</dd>
                </div>
              </dl>
            `;
          },
        },
        {
          id: "providers",
          label: "Providers",
          title: "Providers",
          render() {
            return `
              <dl class="info-terms">
                <div>
                  <dt>Codex</dt>
                  <dd>Reads local Codex data, or the Codex CLI depending on source priority.</dd>
                </div>
                <div>
                  <dt>Claude</dt>
                  <dd>Reads local Claude data, or the Claude CLI depending on source priority.</dd>
                </div>
                <div>
                  <dt>Cursor</dt>
                  <dd>Uses the Cursor access token from Keychain to query the Cursor API.</dd>
                </div>
              </dl>
              <p>
                Each provider can be shown or hidden in settings. Hiding a provider also
                excludes it from the next refresh.
              </p>
            `;
          },
        },
        {
          id: "source-priority",
          label: "Source priority",
          title: "Source priority",
          render() {
            return `
              <dl class="info-terms">
                <div>
                  <dt>Fast</dt>
                  <dd>Quick sources only.</dd>
                </div>
                <div>
                  <dt>Full</dt>
                  <dd>Quick sources first, CLI as fallback.</dd>
                </div>
                <div>
                  <dt>Best</dt>
                  <dd>CLI first, quick sources as fallback.</dd>
                </div>
              </dl>
              <p>Applies to <b>Codex</b> and <b>Claude</b> only. <b>Cursor</b> is not affected.</p>
              <p class="info-note">
                CLI data is usually more accurate and current, but slower. Providers refresh
                independently, so a slow one won't block the rest.
              </p>
              <div class="info-links info-links--two-up" aria-label="Setup guides">
                <button type="button" class="info-link info-link--external" data-open-external="claude">
                  Claude&nbsp;Code&nbsp;setup
                </button>
                <button type="button" class="info-link info-link--external" data-open-external="codex">
                  Codex&nbsp;CLI
                </button>
              </div>
            `;
          },
        },
        {
          id: "data-errors",
          label: "Data errors",
          title: "Data errors",
          render() {
            return `
              <p>
                A provider block shows "no fresh data" when its source didn't return a
                usable result in time.
              </p>
              <dl class="info-terms">
                <div>
                  <dt>Local data</dt>
                  <dd>The saved provider snapshot is outdated when its expected reset time has already passed. Use Full or Best mode, or open the provider CLI to create a fresh local snapshot.</dd>
                </div>
                <div>
                  <dt>CLI</dt>
                  <dd>The provider CLI isn't installed, or isn't logged in.</dd>
                </div>
                <div>
                  <dt>Network</dt>
                  <dd>The request failed or timed out.</dd>
                </div>
                <div>
                  <dt>Cursor</dt>
                  <dd>The Keychain access token is missing or has expired.</dd>
                </div>
              </dl>
              <p class="info-note">Try a manual refresh first; most errors are transient.</p>
              <div class="info-links">
                <button type="button" class="info-link info-link--internal" data-open-help="source-priority">
                  Source&nbsp;priority
                </button>
              </div>
            `;
          },
        },
        {
          id: "notifications",
          label: "Notifications",
          title: "Notifications",
          render() {
            return `
              <p>
                When enabled, AI-Limits sends a system notification as a provider's
                remaining limit runs low, so you don't have to keep the app open to
                notice.
              </p>
              <dl class="info-terms">
                <div>
                  <dt>Trigger</dt>
                  <dd>A provider's remaining limit crosses a low threshold.</dd>
                </div>
                <div>
                  <dt>Control</dt>
                  <dd>Toggle notifications on or off any time in settings.</dd>
                </div>
                <div>
                  <dt>Platform</dt>
                  <dd>macOS only for now; Windows and Linux are next.</dd>
                </div>
              </dl>
            `;
          },
        },
        {
          id: "permissions",
          label: "Permissions",
          title: "Permissions",
          render() {
            return `
              <dl class="info-terms">
                <div>
                  <dt>Network</dt>
                  <dd>To query the Cursor API and check for available data.</dd>
                </div>
                <div>
                  <dt>Keychain</dt>
                  <dd>Read-only access to the Cursor access token.</dd>
                </div>
                <div>
                  <dt>Local files</dt>
                  <dd>Read-only access to local Codex and Claude data folders.</dd>
                </div>
                <div>
                  <dt>Notifications</dt>
                  <dd>To alert you when a limit runs low.</dd>
                </div>
                <div>
                  <dt>CLI</dt>
                  <dd>Runs the <code>claude</code> or <code>codex</code> CLI, only in Full or Best mode.</dd>
                </div>
              </dl>
              <p class="info-note">
                External links only open from a fixed allowlist. Nothing else is read,
                written, or sent anywhere.
              </p>
            `;
          },
        },
        {
          id: "cli-mode",
          label: "CLI mode",
          title: "CLI mode",
          render() {
            return `
              <p>
                The terminal interface is stateless: one query per run, no saved settings,
                no background refresh or notifications.
              </p>
              <dl class="info-terms">
                <div>
                  <dt>Good for</dt>
                  <dd>Scripts, CI, and quick checks, with plain, structured, or raw output.</dd>
                </div>
                <div>
                  <dt>Not for</dt>
                  <dd>Ongoing monitoring; use the desktop app for that.</dd>
                </div>
              </dl>
              <div class="cli-command-row" aria-label="Terminal command">
                <code data-cli-command>Loading command…</code>
                <button type="button" class="info-link cli-command-action" data-copy-cli-command disabled>Copy</button>
                <button type="button" class="info-link cli-command-action" data-run-cli-command disabled>Run</button>
              </div>
            `;
          },
        },
        {
          id: "limitations",
          label: "Limitations",
          title: "Limitations",
          render() {
            return `
              <p>The desktop app is in beta and improving. Current known limits:</p>
              <dl class="info-terms">
                <div>
                  <dt>macOS</dt>
                  <dd>Signed and notarized; no DMG installer yet.</dd>
                </div>
                <div>
                  <dt>Windows / Linux</dt>
                  <dd>Builds are unsigned and still being tested with real users.</dd>
                </div>
                <div>
                  <dt>Notifications</dt>
                  <dd>macOS only for now.</dd>
                </div>
                <div>
                  <dt>Local sources</dt>
                  <dd>Some Codex and Claude local sources aren't available yet outside macOS.</dd>
                </div>
              </dl>
              <p class="info-note">CLI-backed sources are the most reliable option across platforms today.</p>
            `;
          },
        },
        {
          id: "for-developers",
          label: "For developers",
          title: "For developers",
          render() {
            return `
              <p>AI-Limits is open source under the MIT License.</p>
              <dl class="info-terms">
                <div>
                  <dt>Core</dt>
                  <dd>A shared Rust core powers both interfaces.</dd>
                </div>
                <div>
                  <dt>Desktop</dt>
                  <dd>A Tauri app with a web-technology UI.</dd>
                </div>
                <div>
                  <dt>CLI</dt>
                  <dd>A stateless command-line interface for scripts and CI.</dd>
                </div>
              </dl>
              <div class="info-links info-links--two-up">
                <button type="button" class="info-link info-link--external" data-open-external="github">
                  Source&nbsp;on&nbsp;GitHub
                </button>
                <button type="button" class="info-link info-link--external" data-open-external="license">
                  MIT&nbsp;License
                </button>
              </div>
            `;
          },
        },
      ];
      const DEFAULT_HELP_CHAPTER = HELP_CHAPTERS[0].id;

      const DEFAULT_APP_SETTINGS = {
        notifications: true,
        cursor: true,
        cloud: true,
        codex: true,
        sourcePriority: "full",
      };

      const THEME_ACCENTS = {
        danger: [255, 42, 34],
        warning: [255, 207, 22],
        success: [126, 217, 65],
      };

      const providerList = document.querySelector("#provider-list");
      const statusLine = document.querySelector("#status-line");
      const refreshButton = document.querySelector("#refresh-button");
      const settingsMenu = document.querySelector("#settings-menu");
      const settingsButton = document.querySelector("#settings-button");
      const settingsDropdown = document.querySelector("#settings-dropdown");
      const helpButton = document.querySelector("#help-button");
      const helpView = document.querySelector("#help-view");
      const homeView = document.querySelector("#home-view");
      const helpMenu = document.querySelector("#help-menu");
      const helpContent = document.querySelector("#help-content");
      const helpBack = document.querySelector("#help-back");
      const settingInputs = {
        notifications: document.querySelector("#setting-notifications"),
        cursor: document.querySelector("#setting-cursor"),
        cloud: document.querySelector("#setting-cloud"),
        codex: document.querySelector("#setting-codex"),
        sourcePriority: document.querySelector("#setting-source-priority"),
        sourcePriorityInfo: document.querySelector("#setting-source-priority-info"),
        darkTheme: document.querySelector("#setting-dark-theme"),
      };

      const providerRefreshIntervals = new Map();
      const providerRefreshTimers = new Map();
      const providerRefreshInFlight = new Set();
      const providerStatusHideTimers = new Map();
      const providerDataCache = new Map();

      let appSettings = loadAppSettings();
      let appTheme = loadAppTheme();

      function getSystemTheme() {
        if (typeof window.matchMedia !== "function") {
          return "light";
        }

        if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          return "dark";
        }

        if (window.matchMedia("(prefers-color-scheme: light)").matches) {
          return "light";
        }

        return "light";
      }

      function loadAppTheme() {
        try {
          const stored = localStorage.getItem(THEME_STORAGE_KEY);
          if (!stored) {
            return { mode: "system", value: getSystemTheme() };
          }

          const parsed = JSON.parse(stored);
          if (
            parsed &&
            parsed.mode === "manual" &&
            (parsed.value === "dark" || parsed.value === "light")
          ) {
            return { mode: "manual", value: parsed.value };
          }

          return { mode: "system", value: getSystemTheme() };
        } catch {
          return { mode: "system", value: getSystemTheme() };
        }
      }

      function saveAppTheme() {
        localStorage.setItem(THEME_STORAGE_KEY, JSON.stringify(appTheme));
      }

      function applyAppTheme() {
        document.documentElement.dataset.theme = appTheme.value;
        settingInputs.darkTheme.checked = appTheme.value === "dark";
      }

      function setManualTheme(isDark) {
        appTheme = { mode: "manual", value: isDark ? "dark" : "light" };
        saveAppTheme();
        applyAppTheme();
      }

      function syncSystemTheme() {
        if (appTheme.mode === "manual") {
          return;
        }

        appTheme = { mode: "system", value: getSystemTheme() };
        applyAppTheme();
      }

      function normalizeSourcePriority(value) {
        return SOURCE_PRIORITY_OPTIONS.includes(value) ? value : DEFAULT_APP_SETTINGS.sourcePriority;
      }

      function migrateSourcePriority(parsed) {
        if (SOURCE_PRIORITY_OPTIONS.includes(parsed.sourcePriority)) {
          return parsed.sourcePriority;
        }

        if (parsed.useCliFallback === true) {
          return "full";
        }

        return DEFAULT_APP_SETTINGS.sourcePriority;
      }

      function loadAppSettings() {
        try {
          const stored = localStorage.getItem(SETTINGS_STORAGE_KEY);
          if (!stored) {
            return { ...DEFAULT_APP_SETTINGS };
          }

          const parsed = JSON.parse(stored);
          return {
            notifications:
              typeof parsed.notifications === "boolean"
                ? parsed.notifications
                : DEFAULT_APP_SETTINGS.notifications,
            cursor:
              typeof parsed.cursor === "boolean" ? parsed.cursor : DEFAULT_APP_SETTINGS.cursor,
            cloud: typeof parsed.cloud === "boolean" ? parsed.cloud : DEFAULT_APP_SETTINGS.cloud,
            codex: typeof parsed.codex === "boolean" ? parsed.codex : DEFAULT_APP_SETTINGS.codex,
            sourcePriority: migrateSourcePriority(parsed),
          };
        } catch {
          return { ...DEFAULT_APP_SETTINGS };
        }
      }

      function saveAppSettings() {
        localStorage.setItem(SETTINGS_STORAGE_KEY, JSON.stringify(appSettings));
      }

      function normalizeUpdateFrequency(frequency) {
        if (typeof frequency !== "string") {
          return DEFAULT_UPDATE_FREQUENCY;
        }

        return updateFrequencyOptions.includes(frequency)
          ? frequency
          : DEFAULT_UPDATE_FREQUENCY;
      }

      function loadProviderIntervalsFromStorage() {
        try {
          const stored = localStorage.getItem(PROVIDER_INTERVALS_STORAGE_KEY);
          if (!stored) {
            return {};
          }

          const parsed = JSON.parse(stored);
          if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
            return {};
          }

          const intervals = {};
          for (const providerId of PROVIDER_IDS) {
            intervals[providerId] = normalizeUpdateFrequency(parsed[providerId]);
          }
          return intervals;
        } catch {
          return {};
        }
      }

      function initProviderIntervals() {
        const stored = loadProviderIntervalsFromStorage();
        for (const providerId of PROVIDER_IDS) {
          providerRefreshIntervals.set(
            providerId,
            stored[providerId] ?? DEFAULT_UPDATE_FREQUENCY,
          );
        }
      }

      function saveProviderIntervals() {
        const payload = {};
        for (const providerId of PROVIDER_IDS) {
          payload[providerId] = getProviderInterval(providerId);
        }
        localStorage.setItem(PROVIDER_INTERVALS_STORAGE_KEY, JSON.stringify(payload));
      }

      function buildSourcePriorityControlHtml() {
        return SOURCE_PRIORITY_OPTIONS.map((priority) => {
          const selected = priority === appSettings.sourcePriority;
          return `<button type="button" data-source-priority="${priority}" aria-pressed="${selected}">${SOURCE_PRIORITY_LABELS[priority]}</button>`;
        }).join("");
      }

      function renderSettingsSourcePriorityControl() {
        settingInputs.sourcePriority.innerHTML = buildSourcePriorityControlHtml();
        attachSourcePriorityControls(settingInputs.sourcePriority);
      }

      function syncSourcePriorityControls() {
        for (const control of document.querySelectorAll("[data-source-priority-control]")) {
          for (const button of control.querySelectorAll("[data-source-priority]")) {
            const selected = button.dataset.sourcePriority === appSettings.sourcePriority;
            button.setAttribute("aria-pressed", String(selected));
          }
        }
      }

      function setSourcePriority(priority) {
        const normalized = normalizeSourcePriority(priority);
        if (appSettings.sourcePriority === normalized) {
          return;
        }

        appSettings.sourcePriority = normalized;
        saveAppSettings();
        syncSourcePriorityControls();
      }

      function attachSourcePriorityControls(container) {
        container.dataset.sourcePriorityControl = "";
        for (const button of container.querySelectorAll("[data-source-priority]")) {
          button.addEventListener("click", () => {
            setSourcePriority(button.dataset.sourcePriority);
          });
        }
      }

      function syncSettingsInputs() {
        settingInputs.notifications.checked = appSettings.notifications;
        settingInputs.cursor.checked = appSettings.cursor;
        settingInputs.cloud.checked = appSettings.cloud;
        settingInputs.codex.checked = appSettings.codex;
        settingInputs.darkTheme.checked = appTheme.value === "dark";
        renderSettingsSourcePriorityControl();
        syncSourcePriorityControls();
      }

      function settingsToQuery() {
        return {
          enabledCodex: appSettings.codex,
          enabledClaude: appSettings.cloud,
          enabledCursor: appSettings.cursor,
          sourcePriority: appSettings.sourcePriority,
          notificationsEnabled: appSettings.notifications,
        };
      }

      function isProviderEnabled(providerId) {
        switch (providerId) {
          case "codex":
            return appSettings.codex;
          case "claude":
            return appSettings.cloud;
          case "cursor":
            return appSettings.cursor;
          default:
            return false;
        }
      }

      function removeDisabledProviderBlocks() {
        for (const providerId of PROVIDER_IDS) {
          if (isProviderEnabled(providerId)) {
            continue;
          }

          stopProviderRefreshTimer(providerId);
          clearProviderStatusHideTimer(providerId);
          getProviderBlock(providerId)?.remove();
        }
      }

      function setSettingsMenuOpen(isOpen) {
        settingsDropdown.hidden = !isOpen;
        settingsButton.setAttribute("aria-expanded", String(isOpen));
      }

      function findHelpChapter(chapterId) {
        return HELP_CHAPTERS.find((chapter) => chapter.id === chapterId) ?? HELP_CHAPTERS[0];
      }

      function renderHelpMenu() {
        helpMenu.innerHTML = HELP_CHAPTERS.map(
          (chapter) =>
            `<button type="button" class="help-menu-item" data-help-chapter="${chapter.id}">${escapeHtml(chapter.label)}</button>`,
        ).join("");

        for (const button of helpMenu.querySelectorAll("[data-help-chapter]")) {
          button.addEventListener("click", () => {
            selectHelpChapter(button.dataset.helpChapter);
          });
        }
      }

      function selectHelpChapter(chapterId) {
        const chapter = findHelpChapter(chapterId);

        for (const button of helpMenu.querySelectorAll("[data-help-chapter]")) {
          const isCurrent = button.dataset.helpChapter === chapter.id;
          button.setAttribute("aria-current", isCurrent ? "page" : "false");
        }

        helpContent.innerHTML = chapter.render();
        for (const button of helpContent.querySelectorAll("[data-open-external]")) {
          button.addEventListener("click", () => {
            openExternalSetup(button.dataset.openExternal);
          });
        }
        for (const button of helpContent.querySelectorAll("[data-open-help]")) {
          button.addEventListener("click", () => {
            selectHelpChapter(button.dataset.openHelp);
          });
        }
        for (const button of helpContent.querySelectorAll("[data-copy-text]")) {
          button.addEventListener("click", () => {
            copyHelpText(button);
          });
        }
        const cliCommand = helpContent.querySelector("[data-cli-command]");
        if (cliCommand) {
          loadCliCommand(cliCommand);
        }
        helpContent.querySelector("[data-copy-cli-command]")?.addEventListener("click", (event) => {
          copyHelpText(event.currentTarget);
        });
        helpContent.querySelector("[data-run-cli-command]")?.addEventListener("click", (event) => {
          runCliCommand(event.currentTarget);
        });
      }

      async function loadCliCommand(commandElement) {
        const commandRow = commandElement.closest(".cli-command-row");
        const copyButton = commandRow.querySelector("[data-copy-cli-command]");
        const runButton = commandRow.querySelector("[data-run-cli-command]");
        const invoke = window.__TAURI__?.core?.invoke;
        if (!invoke) {
          commandElement.textContent = "Available in the desktop app";
          return;
        }
        try {
          const command = await invoke("get_cli_command");
          if (!commandElement.isConnected) {
            return;
          }
          commandElement.textContent = command;
          copyButton.dataset.copyText = command;
          copyButton.disabled = false;
          runButton.disabled = false;
        } catch {
          commandElement.textContent = "Command unavailable";
        }
      }

      async function copyHelpText(button) {
        const text = button.dataset.copyText;
        const originalLabel = button.textContent;
        try {
          await navigator.clipboard.writeText(text);
          button.textContent = "Copied";
        } catch {
          button.textContent = "Copy failed";
        }
        setTimeout(() => {
          button.textContent = originalLabel;
        }, 1500);
      }

      async function runCliCommand(button) {
        const originalLabel = button.textContent;
        try {
          await window.__TAURI__.core.invoke("run_cli_in_terminal");
          button.textContent = "Started";
        } catch {
          button.textContent = "Run failed";
        }
        setTimeout(() => {
          button.textContent = originalLabel;
        }, 1500);
      }

      function isHelpOpen() {
        return !helpView.hidden;
      }

      function openHelp(chapterId = DEFAULT_HELP_CHAPTER) {
        setSettingsMenuOpen(false);
        selectHelpChapter(chapterId);
        homeView.hidden = true;
        helpView.hidden = false;
      }

      function closeHelp() {
        helpView.hidden = true;
        homeView.hidden = false;
      }

      function cacheProviderData(provider) {
        providerDataCache.set(provider.id, { ...provider, pending: false });
      }

      function hasCachedProviderData(providerId) {
        const cached = providerDataCache.get(providerId);
        return cached != null && !cached.pending;
      }

      function insertProviderBlockInOrder(block, providerId) {
        const enabledProviders = PROVIDER_IDS.filter(isProviderEnabled);
        const targetIndex = enabledProviders.indexOf(providerId);

        for (let i = targetIndex + 1; i < enabledProviders.length; i += 1) {
          const nextBlock = getProviderBlock(enabledProviders[i]);
          if (nextBlock) {
            providerList.insertBefore(block, nextBlock);
            return;
          }
        }

        providerList.appendChild(block);
      }

      function restoreNewlyEnabledProviders(providerIds) {
        if (!providerIds.length) {
          return;
        }

        clearStatusState();

        for (const providerId of providerIds) {
          if (getProviderBlock(providerId)) {
            continue;
          }

          if (hasCachedProviderData(providerId)) {
            const block = mountProviderBlock(providerDataCache.get(providerId));
            insertProviderBlockInOrder(block, providerId);
            continue;
          }

          const block = mountProviderBlock(createEmptyProvider(providerId));
          insertProviderBlockInOrder(block, providerId);
          refreshSingleProvider(providerId);
        }
      }

      function handleSettingsChange() {
        const previouslyEnabled = PROVIDER_IDS.filter(isProviderEnabled);

        appSettings = {
          notifications: settingInputs.notifications.checked,
          cursor: settingInputs.cursor.checked,
          cloud: settingInputs.cloud.checked,
          codex: settingInputs.codex.checked,
          sourcePriority: appSettings.sourcePriority,
        };
        saveAppSettings();

        const newlyEnabled = PROVIDER_IDS.filter(
          (providerId) =>
            isProviderEnabled(providerId) && !previouslyEnabled.includes(providerId),
        );

        removeDisabledProviderBlocks();
        syncSourcePriorityControls();
        restoreNewlyEnabledProviders(newlyEnabled);
      }

      function providerLabel(providerId) {
        return providerId.charAt(0).toUpperCase() + providerId.slice(1);
      }

      function createEmptyProvider(providerId) {
        return {
          id: providerId,
          label: providerLabel(providerId),
          limits: [],
          availableLimitResets: null,
          sourceId: null,
          dataTimestamp: null,
          selectedUpdateFrequency: getProviderInterval(providerId),
          errorMessage: null,
          noFreshData: false,
          pending: true,
        };
      }

      const MONTH_NAMES = [
        "Jan",
        "Feb",
        "Mar",
        "Apr",
        "May",
        "Jun",
        "Jul",
        "Aug",
        "Sep",
        "Oct",
        "Nov",
        "Dec",
      ];

      // Strips any UTC offset / timezone suffix from a timestamp string, e.g.
      // "Jul 3, 21:41 UTC-2", "2026-06-29T23:09:29Z", "2026-06-29T23:09:29+03:00",
      // "20:48 UTC+3", "20:48 (Asia/Nicosia)" all lose their trailing offset marker.
      function stripTimezoneSuffix(value) {
        return String(value)
          .replace(/\s*\([^()]*\)\s*$/, "") // trailing "(Region/City)"
          .replace(/\s*UTC[+-]\d{1,2}(:\d{2})?\s*$/i, "") // trailing "UTC+3" / "UTC-5:30"
          .replace(/\s*GMT[+-]\d{1,2}(:\d{2})?\s*$/i, "") // trailing "GMT+3"
          .replace(/([+-]\d{2}:\d{2}|Z)$/, "") // ISO offset "+03:00" or "Z"
          .trim();
      }

      // Parses a variety of timestamp shapes the core/backend may send (ISO 8601
      // with or without an offset, epoch millis/seconds, or a Date instance) into
      // a Date object. Returns null if the value cannot be parsed as an instant.
      function parseTimestampToDate(value) {
        if (value instanceof Date) {
          return Number.isNaN(value.getTime()) ? null : value;
        }
        if (typeof value === "number") {
          const date = new Date(value < 1e12 ? value * 1000 : value);
          return Number.isNaN(date.getTime()) ? null : date;
        }
        if (typeof value !== "string") {
          return null;
        }

        const trimmed = value.trim();
        if (!trimmed) {
          return null;
        }

        if (/^\d+$/.test(trimmed)) {
          const numeric = Number(trimmed);
          const date = new Date(trimmed.length > 10 ? numeric : numeric * 1000);
          return Number.isNaN(date.getTime()) ? null : date;
        }

        const parsed = new Date(trimmed);
        return Number.isNaN(parsed.getTime()) ? null : parsed;
      }

      function isSameLocalDay(a, b) {
        return (
          a.getFullYear() === b.getFullYear() &&
          a.getMonth() === b.getMonth() &&
          a.getDate() === b.getDate()
        );
      }

      function pad2(value) {
        return String(value).padStart(2, "0");
      }

      // Formats a Date in device-local time per the Time Display spec:
      // "HH:MM" when the date is today (local), otherwise "MMM D, HH:MM".
      function formatLocalDateTime(date, { now = new Date() } = {}) {
        const time = `${pad2(date.getHours())}:${pad2(date.getMinutes())}`;
        if (isSameLocalDay(date, now)) {
          return time;
        }

        const month = MONTH_NAMES[date.getMonth()];
        return `${month} ${date.getDate()}, ${time}`;
      }

      // Formats an arbitrary timestamp value (ISO string, epoch, or an
      // already-formatted "MMM D, HH:MM UTC±N" style string from the core) for
      // display: converts to device-local time, drops any UTC/offset suffix, and
      // applies the today/not-today display rule. Falls back to a
      // suffix-stripped version of the original text if it cannot be parsed as
      // an instant (so unexpected formats degrade gracefully instead of
      // crashing).
      function formatTimestampForDisplay(value) {
        if (value == null || value === "") {
          return null;
        }

        const parsed = parseTimestampToDate(value);
        if (parsed) {
          return formatLocalDateTime(parsed);
        }

        return stripTimezoneSuffix(value);
      }

      const SOURCE_DISPLAY_LABELS = {
        "codex-local": "Local files",
        "codex-cli": "CLI",
        "claude-cli": "CLI",
        "claude-local": "Local files",
        "cursor-api2": "API2",
      };

      function sourceLabelForDisplay(sourceId) {
        if (sourceId == null || sourceId === "") {
          return "Unknown";
        }

        return SOURCE_DISPLAY_LABELS[sourceId] ?? sourceId;
      }

      function formatSourceIdLine(provider) {
        if (provider.pending) {
          return "—";
        }

        return `${sourceLabelForDisplay(provider.sourceId)},`;
      }

      function formatSourceTimestampLine(provider) {
        if (provider.pending) {
          return "—";
        }

        const timestamp = formatTimestampForDisplay(provider.dataTimestamp) || "unknown";
        return `as of ${timestamp}`;
      }

      function frequencyToMs(frequency) {
        switch (frequency) {
          case "1 min":
            return 60_000;
          case "5 min":
            return 300_000;
          case "10 min":
            return 600_000;
          case "30 min":
            return 1_800_000;
          case "1 hour":
            return 3_600_000;
          default:
            return null;
        }
      }

      function getProviderInterval(providerId) {
        return providerRefreshIntervals.get(providerId) ?? DEFAULT_UPDATE_FREQUENCY;
      }

      function ensureProviderInterval(providerId, fallbackFrequency) {
        if (!providerRefreshIntervals.has(providerId)) {
          providerRefreshIntervals.set(providerId, normalizeUpdateFrequency(fallbackFrequency));
        }
      }

      function stopProviderRefreshTimer(providerId) {
        const timerId = providerRefreshTimers.get(providerId);
        if (timerId == null) {
          return;
        }

        clearInterval(timerId);
        providerRefreshTimers.delete(providerId);
      }

      function restartProviderRefreshTimer(providerId) {
        stopProviderRefreshTimer(providerId);

        if (!isProviderEnabled(providerId)) {
          return;
        }

        const intervalMs = frequencyToMs(getProviderInterval(providerId));
        if (intervalMs == null) {
          return;
        }

        const timerId = setInterval(() => {
          refreshSingleProvider(providerId);
        }, intervalMs);
        providerRefreshTimers.set(providerId, timerId);
      }

      function setProviderInterval(providerId, frequency) {
        if (!updateFrequencyOptions.includes(frequency)) {
          return;
        }

        providerRefreshIntervals.set(providerId, frequency);
        saveProviderIntervals();
        restartProviderRefreshTimer(providerId);
      }

      function colorForRemaining(remainingPercent) {
        const clamped = Math.max(0, Math.min(100, remainingPercent));
        if (clamped <= 1) {
          return `rgb(${THEME_ACCENTS.danger.join(", ")})`;
        }

        const stops = [
          { pct: 1, rgb: THEME_ACCENTS.danger },
          { pct: 50, rgb: THEME_ACCENTS.warning },
          { pct: 100, rgb: THEME_ACCENTS.success },
        ];

        let lower = stops[0];
        let upper = stops[stops.length - 1];
        for (let i = 0; i < stops.length - 1; i += 1) {
          if (clamped >= stops[i].pct && clamped <= stops[i + 1].pct) {
            lower = stops[i];
            upper = stops[i + 1];
            break;
          }
        }

        const span = upper.pct - lower.pct || 1;
        const ratio = (clamped - lower.pct) / span;
        const rgb = lower.rgb.map((channel, i) => Math.round(channel + (upper.rgb[i] - channel) * ratio));
        return `rgb(${rgb.join(", ")})`;
      }

      function escapeHtml(value) {
        return String(value)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function formatDecimal(value) {
        const rounded = Math.round(Number(value) * 10) / 10;
        return Number.isInteger(rounded) ? String(rounded) : rounded.toFixed(1);
      }

      function formatCreditsLine(provider) {
        if (provider.creditsRemaining == null) {
          return "";
        }

        return `Credits: ${formatDecimal(provider.creditsRemaining)}`;
      }

      function buildLimitResetsHtml(provider) {
        if (Number(provider.availableLimitResets) <= 0) {
          return "";
        }

        return `
          <section class="limit-resets-info" aria-label="Resets">
            <div class="limit-resets-title">Resets: ${escapeHtml(provider.availableLimitResets)}</div>
          </section>
        `;
      }

      function buildLimitRowsHtml(provider) {
        if (!provider.limits.length) {
          if (provider.pending) {
            return "";
          }

          if (provider.availableLimitResets != null) {
            return "";
          }

          if (provider.noFreshData) {
            return buildNoFreshDataHtml();
          }

          const message = escapeHtml(provider.errorMessage || "No usable limit records from this source");
          const details = provider.errorMessage === "Local provider data is outdated"
            ? `<button type="button" class="provider-link" data-open-data-errors>More details</button>`
            : "";
          return `<div><p class="provider-message">${message}</p>${details}</div>`;
        }

        return provider.limits
          .map((limit) => {
            const remaining = Number(limit.remainingPercentage) || 0;
            const percent = remaining.toFixed(1);
            const width = Math.max(0, Math.min(100, remaining));
            const fillColor = colorForRemaining(remaining);
            const formattedResetTime = formatTimestampForDisplay(limit.resetTime);
            const resetText = formattedResetTime ? `reset ${escapeHtml(formattedResetTime)}` : "";

            return `
              <div class="limit-row">
                <div class="limit-top">${escapeHtml(limit.label)} | ${percent}% left</div>
                <div class="meter" aria-label="${escapeHtml(provider.label)} ${escapeHtml(limit.label)} ${percent}% left">
                  <span style="width: ${width}%; background: ${fillColor}"></span>
                </div>
                ${resetText ? `<div class="limit-reset">${resetText}</div>` : ""}
              </div>
            `;
          })
          .join("");
      }

      function buildNoFreshDataHtml() {
        return `
          <div class="no-fresh-data">
            <p>No fresh limits' data. Try another source mode:</p>
            <div class="segmented-control" data-source-priority-control role="group" aria-label="Source priority">
              ${buildSourcePriorityControlHtml()}
            </div>
            <button type="button" class="provider-link" data-open-source-priority>
              More details
            </button>
          </div>
        `;
      }

      function renderProvider(provider) {
        const block = document.createElement("article");
        block.className = "provider-block";
        block.dataset.providerId = provider.id;

        const frequencyOptions = updateFrequencyOptions
          .map((option) => {
            const selected = option === getProviderInterval(provider.id) ? "selected" : "";
            return `<option ${selected}>${option}</option>`;
          })
          .join("");

        block.innerHTML = `
          <div class="provider-status" hidden aria-live="polite">
            <span class="provider-status-indicator" aria-hidden="true"></span>
            <span class="provider-status-text"></span>
          </div>
          <div class="provider-content">
            <div class="provider-header">
              <h2>${escapeHtml(provider.label)}</h2>
            </div>
            <div class="limits">${buildLimitRowsHtml(provider)}</div>
            <p class="credits-info" ${provider.creditsRemaining == null ? "hidden" : ""}>
              ${escapeHtml(formatCreditsLine(provider))}
            </p>
            <div class="limit-resets-slot">${buildLimitResetsHtml(provider)}</div>
            <p class="source-info">
              <span class="source-id">${escapeHtml(formatSourceIdLine(provider))}</span>
              <span class="source-timestamp">${escapeHtml(formatSourceTimestampLine(provider))}</span>
            </p>
          </div>
          <div class="provider-actions">
            <label class="frequency-row">
              <span>Upd&nbsp;every</span>
              <select aria-label="${escapeHtml(provider.label)} update interval">${frequencyOptions}</select>
            </label>
            <button type="button" class="provider-manual-refresh" data-manual-refresh>
              UPDATE NOW
            </button>
          </div>
        `;

        return block;
      }

      function getProviderBlock(providerId) {
        return providerList.querySelector(`[data-provider-id="${providerId}"]`);
      }

      function clearProviderStatusHideTimer(providerId) {
        const timerId = providerStatusHideTimers.get(providerId);
        if (timerId == null) {
          return;
        }

        clearTimeout(timerId);
        providerStatusHideTimers.delete(providerId);
      }

      function hideProviderStatus(providerId) {
        const block = getProviderBlock(providerId);
        if (!block) {
          return;
        }

        const status = block.querySelector(".provider-status");
        status.hidden = true;
        status.classList.remove("loading", "updated", "failed");
        status.querySelector(".provider-status-text").textContent = "";
      }

      function scheduleHideProviderStatus(providerId) {
        clearProviderStatusHideTimer(providerId);

        const timerId = setTimeout(() => {
          providerStatusHideTimers.delete(providerId);
          hideProviderStatus(providerId);
        }, PROVIDER_STATUS_HIDE_MS);
        providerStatusHideTimers.set(providerId, timerId);
      }

      function setProviderStatus(providerId, statusType, statusText = "") {
        const block = getProviderBlock(providerId);
        if (!block) {
          return;
        }

        clearProviderStatusHideTimer(providerId);

        const status = block.querySelector(".provider-status");
        status.hidden = false;
        status.classList.remove("loading", "updated", "failed");
        status.classList.add(statusType);
        status.querySelector(".provider-status-text").textContent =
          statusText || (statusType === "loading" ? "Updating" : "");

        if (statusType === "updated" || statusType === "failed") {
          scheduleHideProviderStatus(providerId);
        }
      }

      function updateProviderBlockData(block, provider) {
        block.querySelector(".limits").innerHTML = buildLimitRowsHtml(provider);

        const creditsInfo = block.querySelector(".credits-info");
        const creditsLine = formatCreditsLine(provider);
        if (creditsLine) {
          creditsInfo.hidden = false;
          creditsInfo.textContent = creditsLine;
        } else {
          creditsInfo.hidden = true;
          creditsInfo.textContent = "";
        }

        block.querySelector(".limit-resets-slot").innerHTML = buildLimitResetsHtml(provider);
        block.querySelector(".source-id").textContent = formatSourceIdLine(provider);
        block.querySelector(".source-timestamp").textContent = formatSourceTimestampLine(provider);
        attachSourcePriorityBlockHandlers(block);
      }

      function isProviderRefreshSuccess(provider) {
        return !provider.errorMessage;
      }

      function attachProviderBlockHandlers(block, providerId) {
        const select = block.querySelector("select");
        select.value = getProviderInterval(providerId);
        select.addEventListener("change", (event) => {
          setProviderInterval(providerId, event.target.value);
        });
        block.querySelector("[data-manual-refresh]")?.addEventListener("click", () => {
          refreshSingleProvider(providerId);
        });
        attachSourcePriorityBlockHandlers(block);
      }

      function attachSourcePriorityBlockHandlers(block) {
        const control = block.querySelector("[data-source-priority-control]");
        if (control) {
          attachSourcePriorityControls(control);
          syncSourcePriorityControls();
        }

        const detailsButton = block.querySelector("[data-open-source-priority]");
        if (detailsButton) {
          detailsButton.addEventListener("click", () => {
            openHelp("source-priority");
          });
        }

        const dataErrorsButton = block.querySelector("[data-open-data-errors]");
        if (dataErrorsButton) {
          dataErrorsButton.addEventListener("click", () => {
            openHelp("data-errors");
          });
        }
      }

      async function openExternalSetup(linkId) {
        const url = EXTERNAL_LINKS[linkId];
        if (!url) {
          return;
        }

        const invoke = window.__TAURI__?.core?.invoke;
        if (invoke) {
          await invoke("open_external_url", { url });
          return;
        }

        window.open(url, "_blank", "noopener,noreferrer");
      }

      function mountProviderBlock(provider) {
        ensureProviderInterval(provider.id, provider.selectedUpdateFrequency);
        const block = renderProvider(provider);
        attachProviderBlockHandlers(block, provider.id);
        restartProviderRefreshTimer(provider.id);
        return block;
      }

      function setErrorState(message) {
        statusLine.hidden = false;
        statusLine.classList.remove("loading");
        statusLine.classList.add("error");
        statusLine.textContent = message;
      }

      function clearStatusState() {
        statusLine.textContent = "";
        statusLine.hidden = true;
        statusLine.classList.remove("loading", "error");
      }

      async function fetchSingleProviderLimits(providerId) {
        const invoke = window.__TAURI__?.core?.invoke;
        if (!invoke) {
          throw new Error("Tauri API is unavailable");
        }

        return invoke("get_single_provider_limits", {
          providerId,
          query: settingsToQuery(),
        });
      }

      async function refreshSingleProvider(providerId, { showLoading = true } = {}) {
        if (!isProviderEnabled(providerId) || providerRefreshInFlight.has(providerId)) {
          return;
        }

        providerRefreshInFlight.add(providerId);

        if (showLoading) {
          setProviderStatus(providerId, "loading");
        }

        try {
          const provider = await fetchSingleProviderLimits(providerId);
          provider.pending = false;
          cacheProviderData(provider);

          if (!isProviderEnabled(providerId)) {
            return;
          }

          let block = getProviderBlock(providerId);
          if (!block) {
            block = mountProviderBlock(provider);
            insertProviderBlockInOrder(block, providerId);
          } else {
            updateProviderBlockData(block, provider);
          }

          if (isProviderRefreshSuccess(provider)) {
            setProviderStatus(providerId, "updated", "Updated");
          } else {
            setProviderStatus(providerId, "failed", "Failed");
          }
        } catch {
          if (isProviderEnabled(providerId)) {
            setProviderStatus(providerId, "failed", "Failed");
          }
        } finally {
          providerRefreshInFlight.delete(providerId);
        }
      }

      function refreshEnabledProviders({ initial = false } = {}) {
        removeDisabledProviderBlocks();

        const enabledProviders = PROVIDER_IDS.filter(isProviderEnabled);
        if (!enabledProviders.length) {
          providerList.replaceChildren();
          clearStatusState();
          setErrorState("Enable at least one provider in settings.");
          return;
        }

        clearStatusState();

        if (initial) {
          providerList.replaceChildren(
            ...enabledProviders.map((providerId) =>
              mountProviderBlock(createEmptyProvider(providerId)),
            ),
          );
        }

        for (const providerId of enabledProviders) {
          setProviderStatus(providerId, "loading");
        }

        for (const providerId of enabledProviders) {
          refreshSingleProvider(providerId, { showLoading: false });
        }
      }

      settingsButton.addEventListener("click", (event) => {
        event.stopPropagation();
        setSettingsMenuOpen(settingsDropdown.hidden);
      });

      settingsDropdown.addEventListener("click", (event) => {
        event.stopPropagation();
      });

      settingInputs.sourcePriorityInfo.addEventListener("click", (event) => {
        event.stopPropagation();
        openHelp("source-priority");
      });

      helpButton.addEventListener("click", (event) => {
        event.stopPropagation();
        openHelp();
      });

      helpBack.addEventListener("click", () => {
        closeHelp();
      });

      // Bridge for the macOS native Help menu (see src-tauri/src/main.rs).
      window.__openHelpFromNative = (chapterId) => {
        openHelp(chapterId);
      };

      for (const input of Object.values(settingInputs)) {
        if (input === settingInputs.sourcePriority || input === settingInputs.sourcePriorityInfo) {
          continue;
        }

        if (input === settingInputs.darkTheme) {
          input.addEventListener("change", (event) => {
            setManualTheme(event.target.checked);
          });
          continue;
        }

        input.addEventListener("change", handleSettingsChange);
      }

      if (typeof window.matchMedia === "function") {
        window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", syncSystemTheme);
        window.matchMedia("(prefers-color-scheme: light)").addEventListener("change", syncSystemTheme);
      }

      document.addEventListener("click", () => {
        setSettingsMenuOpen(false);
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          setSettingsMenuOpen(false);
          if (isHelpOpen()) {
            closeHelp();
          }
        }
      });

      renderHelpMenu();
      initProviderIntervals();
      applyAppTheme();
      syncSettingsInputs();
      refreshButton.addEventListener("click", () => {
        refreshEnabledProviders();
      });
      refreshEnabledProviders({ initial: true });
    </script>
  </body>
</html>
